# The SPA's nginx proxies /api and /uploads to the backend, so only the frontend is exposed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sixpack
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "6m"
spec:
  ingressClassName: nginx
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend-service, port: { name: http } }

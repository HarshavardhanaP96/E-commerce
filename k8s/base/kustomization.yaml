apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: sixpack
    includeSelectors: false
resources:
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
images:
  - name: sixpack-backend
    newName: docker.io/DOCKERHUB_USERNAME/sixpack-backend
    newTag: latest
  - name: sixpack-frontend
    newName: docker.io/DOCKERHUB_USERNAME/sixpack-frontend
    newTag: latest

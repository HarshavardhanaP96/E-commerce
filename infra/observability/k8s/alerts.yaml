# 6Pack alert rules, evaluated once per cluster for every namespace the backend runs in.
# Thresholds follow docs/foundations/architecture.md → "Observability plan".
# prod-env alerts are critical (page); anything else (test-env) is a warning.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sixpack
spec:
  groups:
    - name: sixpack.backend
      rules:
        - alert: SixpackBackendUnavailable
          expr: kube_deployment_status_replicas_available{deployment="backend", namespace=~"test-env|prod-env"} == 0
          for: 2m
          labels:
            severity: '{{ if eq $labels.namespace "prod-env" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "No ready backend pods in {{ $labels.namespace }}"
            runbook: "kubectl -n {{ $labels.namespace }} describe deploy/backend; kubectl -n {{ $labels.namespace }} logs deploy/backend"

        - alert: SixpackBackendScrapeDown
          expr: up{job="backend-service"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus can't scrape backend pod {{ $labels.pod }} ({{ $labels.namespace }})"

        - alert: SixpackReadinessFlapping
          expr: changes(kube_pod_status_ready{condition="true", namespace=~"test-env|prod-env", pod=~"backend-.*"}[15m]) > 4
          labels:
            severity: warning
          annotations:
            summary: "Backend pod {{ $labels.pod }} readiness changed {{ $value }} times in 15m ({{ $labels.namespace }})"

        - alert: SixpackHigh5xxRate
          expr: |
            sum by (namespace) (rate(http_server_requests_seconds_count{job="backend-service", status=~"5..", uri!~"/actuator.*"}[5m]))
              /
            sum by (namespace) (rate(http_server_requests_seconds_count{job="backend-service", uri!~"/actuator.*"}[5m]))
              > 0.02
          for: 5m
          labels:
            severity: '{{ if eq $labels.namespace "prod-env" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "{{ $value | humanizePercentage }} of backend requests are failing with 5xx ({{ $labels.namespace }})"

        - alert: SixpackHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (namespace, le) (rate(http_server_requests_seconds_bucket{job="backend-service", uri!~"/actuator.*"}[5m]))
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Backend p95 latency is {{ $value | humanizeDuration }} ({{ $labels.namespace }})"

        - alert: SixpackPaidButUnfulfilled
          # A customer was charged but no order was created. Needs a manual refund or order fix.
          expr: sum by (namespace, tenant) (increase(sixpack_checkout_failed_total{job="backend-service", reason="paid_but_unfulfilled"}[10m])) > 0
          labels:
            severity: '{{ if eq $labels.namespace "prod-env" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "Payment captured without an order for store {{ $labels.tenant }} in {{ $labels.namespace }}"
            runbook: "Search logs for 'paid_but_unfulfilled' (Grafana → Explore → Loki) to get providerOrderId/paymentId."

        - alert: SixpackBadPaymentSignatures
          expr: sum by (namespace, tenant) (increase(sixpack_checkout_failed_total{job="backend-service", reason="bad_signature"}[15m])) > 5
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} checkout attempts with an invalid Razorpay signature in 15m for store {{ $labels.tenant }} ({{ $labels.namespace }})"

        - alert: SixpackBackendMemoryNearLimit
          expr: |
            max by (namespace, pod) (container_memory_working_set_bytes{container="backend", namespace=~"test-env|prod-env"})
              /
            max by (namespace, pod) (kube_pod_container_resource_limits{resource="memory", container="backend", namespace=~"test-env|prod-env"})
              > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Backend pod {{ $labels.pod }} is at {{ $value | humanizePercentage }} of its memory limit ({{ $labels.namespace }})"

        - alert: SixpackAuditWriteFailing
          # Audit entries are written best-effort (a failed write never fails the user's request), so a failure means
          # an admin action or login went unrecorded. Check MongoDB health and the audit_log collection.
          expr: sum by (namespace, tenant) (increase(sixpack_audit_write_total{job="backend-service", result="failure"}[10m])) > 0
          labels:
            severity: '{{ if eq $labels.namespace "prod-env" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "{{ $value }} audit log writes failed in 10m for store {{ $labels.tenant }} ({{ $labels.namespace }}); those events were not recorded"
            runbook: "Search logs for 'Audit write failed' (Grafana → Explore → Loki), then check MongoDB availability and disk."

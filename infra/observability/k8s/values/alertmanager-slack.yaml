# Layered on by install.sh only when SLACK_WEBHOOK_URL is set. The URL lives in the
# alertmanager-slack Secret (mounted below), never in this file.
alertmanager:
  alertmanagerSpec:
    secrets: [alertmanager-slack]
  config:
    route:
      receiver: slack
      group_by: [namespace, alertname]
      routes:
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        - receiver: slack
          matchers: ['severity =~ "critical|warning"']
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#alerts"          # overridden by the webhook's own channel for app webhooks
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'

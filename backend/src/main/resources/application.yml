# All values can be overridden with environment variables (see ../.env.example).
spring:
  application:
    name: sixpack-backend
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/Ecommerce_2024}
      database: ${MONGO_DB:Ecommerce_2024}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:24h}
    cors-allowed-origins: ${CLIENT_URL:http://localhost:5173}
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  user:
    frontend-url: ${FRONTEND_URL:${CLIENT_URL:http://localhost:5173}}
    mail-log-links: ${MAIL_LOG_LINKS:true}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  storage:
    local-dir: ${UPLOADS_DIR:uploads}
  products:
    page-size: ${PRODUCT_PER_PAGE:10}
    variants-enabled: ${PRODUCT_VARIANTS_ENABLED:false}
  features:
    # Platform default for each per-store feature switch (a platform admin can override it per store).
    defaults:
      variants: ${app.products.variants-enabled}
  legal:
    # Effective date of the policy text users must have accepted. Bump only for a material change:
    # every logged-in user is asked to accept again (docs/foundations/compliance-consent.md §6).
    terms-version: ${LEGAL_TERMS_VERSION:2026-10-16}
    privacy-version: ${LEGAL_PRIVACY_VERSION:2026-10-16}
    admin-aup-version: ${LEGAL_ADMIN_AUP_VERSION:2026-10-18}
    ip-hash-salt: ${CONSENT_IP_SALT:}
  platform:
    # First platform administrator (manages tenants). Created at startup if missing; needs 12+ characters.
    admin-email: ${PLATFORM_ADMIN_EMAIL:}
    admin-password: ${PLATFORM_ADMIN_PASSWORD:}
  tenant:
    default-slug: ${TENANT_DEFAULT_SLUG:default}
    default-name: ${TENANT_DEFAULT_NAME:6Pack}
    # Hosts that belong to the default tenant when it is first created. Not needed for a single-store setup
    # (with one tenant every host resolves to it).
    default-domains: ${TENANT_DEFAULT_DOMAINS:localhost,127.0.0.1}
    # Offboarding: how long a closed store can be restored before its data is purged, and how often to check.
    deletion-grace: ${TENANT_DELETION_GRACE:30d}
    purge-interval: ${TENANT_PURGE_INTERVAL:1h}
    # A store created as a trial is suspended when this has passed (the platform admin activates it to keep it).
    trial-length: ${TENANT_TRIAL_LENGTH:14d}
    # Platform default limits per store; a platform admin can set a store's own (PUT /platform/tenants/{id}).
    limits:
      products: ${TENANT_MAX_PRODUCTS:5000}
      uploads: ${TENANT_MAX_UPLOADS:2GB}
      requests-per-minute: ${TENANT_REQUESTS_PER_MINUTE:600}
  payment:
    provider: ${PAYMENT_PROVIDER:fake}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${TRACING_EXPORT_ENABLED:false}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

logging:
  pattern:
    # Plain-text console only (prod uses ECS JSON, which includes every MDC key).
    correlation: "[%X{traceId:-},%X{spanId:-},%X{tenant:-}] "
  level:
    root: INFO
    com.sixpack: INFO
